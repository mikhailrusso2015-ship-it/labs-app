<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idea: vidrio azul y violeta, un panel por rol. Una sola columna en el teléfono, barra lateral en el escritorio. */
:root {
  --ink: #14193A; --muted: #3A4470; --line: rgba(70,80,160,0.16);
  --primary: #4C5FD5; --primary-2: #3F51C9; --deep: #3345B5; --link: #2F3E9E; --tint: #DDE3FB;
  --warn: #B45309; --warn-bg: #FFE6C7; --warn-ink: #8A3F06;
  --crit: #B3261E; --crit-bg: #FDE7E4; --crit-ink: #8C1D18;
  --ok-bg: #DDE3FB; --ok-ink: #2F3E9E;
  --glass: rgba(255,255,255,0.64);
  --shadow: 0 10px 30px rgba(56,72,170,0.16), inset 0 0 0 1px rgba(255,255,255,0.85);
  --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #9DB4F0 linear-gradient(165deg, #BCD6FA 0%, #9DB4F0 50%, #8A9BE6 100%) fixed; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; } h2 { font-size: 17px; font-weight: 600; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 3px solid #14193A; outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); box-shadow: 0 1px 0 rgba(255,255,255,0.9), 0 6px 20px rgba(56,72,170,0.1); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .04em; margin-right: 8px; }
.brand i { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #5668E0, #3345B5); display: inline-flex; align-items: center; justify-content: center; }
.roles { display: flex; gap: 4px; background: rgba(76,95,213,0.1); padding: 4px; border-radius: 999px; flex-wrap: wrap; }
.roles button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; cursor: pointer; color: var(--link); }
.roles button[aria-pressed="true"] { background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; }
.demo-tag { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 12px; border-radius: 999px; }

.shell { max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.side { flex: 1 1 220px; max-width: 250px; background: linear-gradient(180deg, #5668E0, #3345B5); color: #fff; border-radius: 24px; padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 76px; }
.side .who { padding: 10px 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 6px; }
.side .who small { display: block; color: #E4E9FF; font-size: 12px; }
.side button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: transparent; color: #fff; text-align: left; font-weight: 500; cursor: pointer; }
.side button[aria-current="page"] { background: #fff; color: var(--deep); font-weight: 600; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head p { color: var(--muted); }

.card { background: var(--glass); backdrop-filter: blur(16px); box-shadow: var(--shadow); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.dark { background: linear-gradient(150deg, #5668E0, #3345B5); color: #fff; box-shadow: 0 14px 30px rgba(51,69,181,0.35), inset 0 0 0 1px rgba(255,255,255,0.35); }
.card.note { background: rgba(255,255,255,0.5); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kpi small { color: var(--muted); font-size: 13px; } .kpi b { font-size: 28px; line-height: 1.15; font-weight: 700; display: block; }
.kpi .delta { font-size: 12px; font-weight: 600; } .up { color: var(--ok-ink); } .down { color: var(--warn-ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: 13px; }

.btn { min-height: 44px; padding: 0 22px; border: 0; border-radius: 24px; background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; font-weight: 600; cursor: pointer; box-shadow: 0 10px 20px rgba(51,69,181,0.3); }
.btn.ghost { background: rgba(255,255,255,0.8); color: var(--link); box-shadow: inset 0 0 0 2px var(--primary); }
.btn.warn { background: #fff; color: var(--warn-ink); box-shadow: inset 0 0 0 2px var(--warn); }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: rgba(76,95,213,0.1); padding: 4px; border-radius: 999px; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; color: var(--link); cursor: pointer; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); } .chip.warn { background: var(--warn-bg); color: var(--warn-ink); } .chip.crit { background: var(--crit-bg); color: var(--crit-ink); } .chip.gray { background: #E7E9F4; color: #3A4470; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], select, textarea { min-height: 44px; border: 1px solid #7683BA; border-radius: 14px; padding: 0 14px; background: rgba(255,255,255,0.85); color: var(--ink); }
textarea { padding: 10px 14px; }
.tw { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; } td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.bar { height: 12px; border-radius: 6px; background: rgba(76,95,213,0.14); position: relative; overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #5668E0, #3F51C9); }
.check { background: repeating-conic-gradient(#e9ecf8 0% 25%, #fff 0% 50%) 50% / 16px 16px; border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 120px; }
.check img { max-width: 100%; max-height: 160px; }
.drop { border: 2px dashed #7683BA; border-radius: 20px; padding: 22px; text-align: center; background: rgba(255,255,255,0.5); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #14193A; color: #fff; padding: 12px 20px; border-radius: 16px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.mobile { max-width: 520px; width: 100%; margin: 0 auto; }
.rbar { position: relative; height: 14px; border-radius: 7px; background: #E7E9F4; margin: 22px 0 22px; }
.rbar .zone { position: absolute; top: 0; bottom: 0; background: rgba(76,95,213,0.28); border-radius: 7px; }
.rbar .dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.rbar .tick { position: absolute; top: 18px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.sheet { background: #fff; color: #14193A; border-radius: 6px; padding: 28px; box-shadow: 0 8px 30px rgba(20,25,58,.2); display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
.sheet table { min-width: 0; font-size: 13px; }
.sheet .foot { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.sheet .sig { position: relative; width: 250px; height: 120px; }
.sheet .sig img { position: absolute; }
.modal-bg { position: fixed; inset: 0; background: rgba(20,25,58,.55); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 20px 12px; overflow-y: auto; }
.modal { background: #EEF1FB; border-radius: 24px; padding: 18px; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
.spark { display: block; }
hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
ul.clean { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) { .side { max-width: none; position: static; flex-direction: row; flex-wrap: wrap; } .side .who { flex: 1 1 100%; } .demo-tag { margin-left: 0; } h1 { font-size: 24px; } }
@media print { body { background: #fff; } body * { visibility: hidden; } .sheet, .sheet * { visibility: visible; } .sheet { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 3C12 3 5 11 5 15a7 7 0 0 0 14 0C19 11 12 3 12 3z"/></svg></i>LABS</div>
  <div class="roles" role="group" aria-label="Ver la app como" id="roles"></div>
  <span class="demo-tag">Demo con datos de ejemplo. El selector de rol es solo para la demostración.</span>
</div></header>
<div id="app"></div>
<div id="toast-host" aria-live="polite"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="ui2.js"></script>
</body>
</html>
