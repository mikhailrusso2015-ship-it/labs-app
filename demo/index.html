<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idea: vidrio azul y violeta, un panel por rol. Una sola columna en el teléfono, barra lateral en el escritorio. */
:root {
  --ink: #14193A; --muted: #3A4470; --line: rgba(70,80,160,0.16);
  --primary: #4C5FD5; --primary-2: #3F51C9; --deep: #3345B5; --link: #2F3E9E; --tint: #DDE3FB;
  --warn: #B45309; --warn-bg: #FFE6C7; --warn-ink: #8A3F06;
  --crit: #B3261E; --crit-bg: #FDE7E4; --crit-ink: #8C1D18;
  --ok-bg: #DDE3FB; --ok-ink: #2F3E9E;
  --glass: rgba(255,255,255,0.64);
  --shadow: 0 10px 30px rgba(56,72,170,0.16), inset 0 0 0 1px rgba(255,255,255,0.85);
  --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #9DB4F0 linear-gradient(165deg, #BCD6FA 0%, #9DB4F0 50%, #8A9BE6 100%) fixed; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; } h2 { font-size: 17px; font-weight: 600; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 3px solid #14193A; outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); box-shadow: 0 1px 0 rgba(255,255,255,0.9), 0 6px 20px rgba(56,72,170,0.1); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .04em; margin-right: 8px; }
.brand i { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #5668E0, #3345B5); display: inline-flex; align-items: center; justify-content: center; }
.roles { display: flex; gap: 4px; background: rgba(76,95,213,0.1); padding: 4px; border-radius: 999px; flex-wrap: wrap; }
.roles button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; cursor: pointer; color: var(--link); }
.roles button[aria-pressed="true"] { background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; }
.demo-tag { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 12px; border-radius: 999px; }

.shell { max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.side { flex: 1 1 220px; max-width: 250px; background: linear-gradient(180deg, #5668E0, #3345B5); color: #fff; border-radius: 24px; padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 76px; }
.side .who { padding: 10px 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 6px; }
.side .who small { display: block; color: #E4E9FF; font-size: 12px; }
.side button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: transparent; color: #fff; text-align: left; font-weight: 500; cursor: pointer; }
.side button[aria-current="page"] { background: #fff; color: var(--deep); font-weight: 600; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head p { color: var(--muted); }

.card { background: var(--glass); backdrop-filter: blur(16px); box-shadow: var(--shadow); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.dark { background: linear-gradient(150deg, #5668E0, #3345B5); color: #fff; box-shadow: 0 14px 30px rgba(51,69,181,0.35), inset 0 0 0 1px rgba(255,255,255,0.35); }
.card.note { background: rgba(255,255,255,0.5); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kpi small { color: var(--muted); font-size: 13px; } .kpi b { font-size: 28px; line-height: 1.15; font-weight: 700; display: block; }
.kpi .delta { font-size: 12px; font-weight: 600; } .up { color: var(--ok-ink); } .down { color: var(--warn-ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: 13px; }

.btn { min-height: 44px; padding: 0 22px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; font: inherit; font-weight: 600; font-size: 15px; letter-spacing: .1px; cursor: pointer; box-shadow: 0 6px 14px rgba(51,69,181,.28); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-align: center; line-height: 1.1; transition: transform .12s, box-shadow .12s, background .12s; }
.btn:active { transform: scale(.97); box-shadow: 0 3px 8px rgba(51,69,181,.25); }
.btn.ghost { background: rgba(63,81,201,.11); color: var(--link); box-shadow: none; }
.btn.ghost:hover { background: rgba(63,81,201,.18); }
.btn.warn { background: #FFF1D6; color: var(--warn-ink); box-shadow: none; }
.btn.rm { background: #FDEAEA; color: #B42318; box-shadow: none; }
.btn.rm:hover { background: #FBD9D9; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 12px; }
.dark .btn { background: #fff; color: #2F3FB0; box-shadow: 0 6px 14px rgba(10,15,60,.3); } .dark .btn.ghost { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .btnrow .btn { width: 100%; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: rgba(76,95,213,0.1); padding: 4px; border-radius: 999px; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; color: var(--link); cursor: pointer; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); } .chip.warn { background: var(--warn-bg); color: var(--warn-ink); } .chip.crit { background: var(--crit-bg); color: var(--crit-ink); } .chip.gray { background: #E7E9F4; color: #3A4470; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], select, textarea { min-height: 44px; border: 1px solid #7683BA; border-radius: 14px; padding: 0 14px; background: rgba(255,255,255,0.85); color: var(--ink); }
textarea { padding: 10px 14px; }
.tw { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; } td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.bar { height: 12px; border-radius: 6px; background: rgba(76,95,213,0.14); position: relative; overflow: hidden; } .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #5668E0, #3F51C9); }
.check { background: repeating-conic-gradient(#e9ecf8 0% 25%, #fff 0% 50%) 50% / 16px 16px; border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 120px; }
.check img { max-width: 100%; max-height: 160px; }
.drop { border: 2px dashed #7683BA; border-radius: 20px; padding: 22px; text-align: center; background: rgba(255,255,255,0.5); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #14193A; color: #fff; padding: 12px 20px; border-radius: 16px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.mobile { max-width: 520px; width: 100%; margin: 0 auto; }
.rbar { position: relative; height: 14px; border-radius: 7px; background: #E7E9F4; margin: 22px 0 22px; }
.rbar .zone { position: absolute; top: 0; bottom: 0; background: rgba(76,95,213,0.28); border-radius: 7px; }
.rbar .dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.rbar .tick { position: absolute; top: 18px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.sheet { background: #fff; color: #14193A; border-radius: 4px; width: 816px; min-height: 1056px; padding: 64px 68px; box-shadow: 0 8px 30px rgba(20,25,58,.25); display: flex; flex-direction: column; gap: 18px; font-size: 15px; line-height: 1.5; }
.sheet table { min-width: 0; font-size: 15px; width: 100%; }
.sheet th, .sheet td { padding: 9px 10px; }
.sheet .foot { margin-top: auto; }
.paper-fit { width: 100%; overflow: hidden; border-radius: 4px; box-shadow: 0 10px 28px rgba(20,25,58,.28); background: #fff; }
.paper-fit .sheet { box-shadow: none; }
.sheetbar { margin-bottom: 4px; }
.sheet .foot { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.sheet .sig { position: relative; width: 250px; height: 120px; }
.sheet .sig img { position: absolute; }
.modal-bg { position: fixed; inset: 0; background: rgba(20,25,58,.55); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 20px 12px; overflow-y: auto; }
.modal { background: #EEF1FB; border-radius: 24px; padding: 18px; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
.spark { display: block; }
hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
ul.clean { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) { .side { max-width: none; position: static; flex-direction: row; flex-wrap: wrap; } .side .who { flex: 1 1 100%; } .demo-tag { margin-left: 0; } h1 { font-size: 24px; } }
@media print { body { background: #fff; } body * { visibility: hidden; } .sheet, .sheet * { visibility: visible; } .sheet { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

.demo-tag { margin-left: 0; }
.sep { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; padding: 12px 12px 2px; }
.login { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 16px; }
.login .card { width: 100%; max-width: 440px; }
.meter { display: flex; gap: 4px; } .meter i { flex: 1; height: 6px; border-radius: 3px; background: #D5DAF0; } .meter i.on1 { background: #B3261E; } .meter i.on2 { background: #B45309; } .meter i.on3 { background: #4C5FD5; }
.err { color: var(--crit-ink); background: var(--crit-bg); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.okmsg { color: var(--ok-ink); background: var(--ok-bg); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.thread { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding: 4px; }
.bub { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; background: #fff; align-self: flex-start; box-shadow: 0 2px 8px rgba(56,72,170,.12); }
.bub.me { align-self: flex-end; background: linear-gradient(135deg, #5668E0, #3F51C9); color: #fff; }
.bub small { display: block; opacity: .7; font-size: 11px; margin-top: 2px; }
details.acc { background: rgba(255,255,255,0.7); border-radius: 16px; padding: 0 14px; } details.acc summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; } details.acc[open] { padding-bottom: 12px; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 16px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
.iconbtn { position: relative; min-width: 44px; min-height: 44px; border-radius: 22px; border: 0; background: rgba(76,95,213,0.1); cursor: pointer; font-weight: 600; color: var(--link); padding: 0 14px; }
.iconbtn .badge { position: absolute; top: 2px; right: 2px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=tel], select, textarea { min-height: 44px; border-radius: 14px; border: 1px solid var(--line); padding: 8px 12px; background: rgba(255,255,255,0.85); width: 100%; }
textarea { min-height: 88px; }
.stat-ok { color: var(--ok-ink); }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
.err[hidden]{display:none!important}
#toast-host{pointer-events:none}
.card,.main,.tw{min-width:0;max-width:100%}
.tw{position:relative}

/* ---- Selector de periodo con sombra para que no se pierda con el fondo ---- */
.seg { background: #fff; box-shadow: 0 6px 18px rgba(51,69,181,.30), 0 1px 3px rgba(20,25,58,.18), inset 0 0 0 1px rgba(76,95,213,.25); }
.seg button { color: var(--link); }
/* ---- Teléfono: menú de botones compactos, una pantalla por opción ---- */
.hub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hubsep { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 4px 0; }
.tile { min-height: 50px; border: 0; border-radius: 18px; padding: 10px 14px; text-align: left; background: #fff; color: var(--link); font-weight: 600; font-size: 14px; line-height: 1.25; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 6px 16px rgba(51,69,181,.18), inset 0 0 0 1px rgba(255,255,255,.9); }
.tile:active { transform: scale(.98); }
.tile .badge { font-style: normal; flex: none; }
.hubhead { padding: 14px 16px; gap: 2px; } .hubhead small { color: #E4E9FF; }
.backbar { display: flex; align-items: center; gap: 10px; } .backbar b { font-size: 17px; }
.secs { display: flex; flex-direction: column; gap: 8px; }
.secbtn { min-height: 52px; border: 0; border-radius: 16px; padding: 10px 14px; background: #fff; color: var(--ink); font-weight: 600; text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(51,69,181,.14); }
.secbtn i { font-style: normal; font-size: 22px; color: var(--primary); }
@media (max-width: 760px) {
  .top { position: static; }
  .top-in { padding: 6px 10px; gap: 6px; }
  .brand { font-size: 17px; margin-right: 0; } .brand i { width: 28px; height: 28px; }
  .roles { order: 3; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; padding: 3px; }
  .roles button { min-height: 34px; padding: 0 12px; font-size: 13px; white-space: nowrap; }
  #topright { gap: 6px; } #topright .nm { display: none; }
  .iconbtn { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .shell { padding: 10px; gap: 10px; } .main { gap: 10px; flex-basis: 100%; }
  .card { padding: 14px; border-radius: 20px; gap: 10px; }
  .grid { gap: 10px; } .grid.two { grid-template-columns: 1fr; }
  .grid:has(.kpi) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi b { font-size: 22px; } .kpi small { font-size: 12px; }
  h1 { font-size: 22px; } h2 { font-size: 16px; }
  .head { gap: 6px; } .head p { font-size: 13px; }
  .seg button { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .deskback { display: none; }
  .modal { padding: 12px; border-radius: 20px; } .modal-bg { padding: 10px 8px; }
}
@media (min-width: 761px) { .backbar { display: none; } }
@media print { .paper-fit { box-shadow: none; height: auto !important; overflow: visible !important; } .paper-fit .sheet { transform: none !important; width: 100%; min-height: 0; } .sheetbar { display: none; } }

.demogrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.demobtn { text-align: left; border: 0; border-radius: 16px; padding: 10px 12px; background: #fff; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 76px; box-shadow: 0 4px 12px rgba(51,69,181,.16), inset 0 0 0 1px rgba(76,95,213,.18); }
.demobtn b { color: var(--link); font-size: 15px; } .demobtn span { font-size: 12px; line-height: 1.3; color: var(--muted); }
.demobtn:last-child { grid-column: 1 / -1; min-height: 0; }
.demobtn:active { transform: scale(.98); }
.paym { background: #fff; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 12px rgba(51,69,181,.14); } .paym.off { opacity: .7; }
.payrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 6px; } .payv { font-weight: 600; word-break: break-all; }
.copybtn { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(76,95,213,.12); color: var(--link); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; } .copybtn:active { background: var(--primary); color: #fff; }
.roles:empty { display: none; }
.login .card .row.between { gap: 8px; } .login .card .row.between .btn { flex: 1 1 140px; justify-content: center; text-align: center; }

/* ---- Barra inferior ---- */
body.has-dock { padding-bottom: 96px; }
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; }
#dock[hidden] { display: none; }
.dock-in { pointer-events: auto; position: relative; max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; align-items: end; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
.dock-bg { position: absolute; inset: 0; pointer-events: none; filter: drop-shadow(0 -6px 14px rgba(51,69,181,.22)); }
.dock-bg i { display: block; height: 100%; background: #fff; border-radius: 26px 26px 0 0; -webkit-mask: radial-gradient(circle 42px at 50% 2px, transparent 41px, #000 42px); mask: radial-gradient(circle 42px at 50% 2px, transparent 41px, #000 42px); }
.dk { position: relative; z-index: 1; border: 0; background: none; color: #7A81B3; font: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; min-height: 52px; cursor: pointer; border-radius: 14px; }
.dk svg { width: 24px; height: 24px; } .dk.on { color: var(--link, #3345B5); } .dk.on::after { content: ''; position: absolute; top: -8px; width: 22px; height: 3px; border-radius: 3px; background: var(--link, #3345B5); }
.dk:focus-visible { outline: 3px solid #3345B5; outline-offset: 1px; }
.dk-c { justify-content: flex-end; color: #5B3BD6; }
.dk-c svg { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; padding: 17px; box-sizing: content-box; border-radius: 50%; background: linear-gradient(145deg, #8A6CF7, #5B3BD6); color: #fff; box-shadow: 0 8px 18px rgba(91,59,214,.5); }
.dk-c:active svg { transform: translateX(-50%) scale(.95); }
.dk-c.on::after { display: none; } .dk-c.on svg { box-shadow: 0 0 0 4px rgba(91,59,214,.25), 0 8px 18px rgba(91,59,214,.5); }
.dbadge { position: absolute; top: 2px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: #F59E0B; color: #3B2300; font-size: 11px; font-style: normal; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
body.has-dock .toast { bottom: 110px; } .modal-bg, .modal { z-index: 60; }
@media (min-width: 761px) { #dock { left: 50%; right: auto; transform: translateX(-50%); width: 560px; } .dock-bg i { border-radius: 26px; } .dock-in { margin-bottom: 14px; } body.has-dock { padding-bottom: 110px; } }
/* ---- Escáner ---- */
.scan-bg { position: fixed; inset: 0; z-index: 80; background: rgba(20,25,58,.72); display: flex; align-items: flex-end; justify-content: center; overflow: auto; }
.scan-in { background: #f3f5ff; width: min(560px, 100%); max-height: 94vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.scanbox { position: relative; background: #0d1030; border-radius: 18px; overflow: hidden; aspect-ratio: 1/1; max-height: 46vh; width: 100%; display: grid; place-items: center; }
